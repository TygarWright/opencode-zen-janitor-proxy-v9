<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>JanitorAI Proxy v9</title><style>body{font-family:system-ui;background:#080b10;color:#eee;max-width:800px;margin:auto;padding:18px}section{background:#111720;border:1px solid #293241;border-radius:16px;padding:16px;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #354050;background:#090d13;color:#fff}button{background:#286cff;border:0;font-weight:700}.mono{word-break:break-all;background:#090d13;padding:12px;border-radius:10px}.ok{color:#70e7a1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style><h1>JanitorAI Multi-Provider Proxy v9</h1><section><b>Provider</b><select id="mode"><option>auto</option><option>opencode</option><option>bitdeer</option></select><button onclick="save()">Save provider mode</button><p id="status">Loading…</p></section><section><b>OpenCode Zen keys</b><div id="oks"></div><b>Bitdeer keys</b><div id="bks"></div><button onclick="save()">Save keys</button></section><section><b>JanitorAI</b><p>API URL</p><div class="mono" id="url">—</div><p>API key</p><div class="mono" id="key">—</div><p>Model: <b>deepseek-v4-flash</b></p></section><section><b>Performance</b><pre id="stats">—</pre></section><script>const $=x=>document.getElementById(x);for(const p of ['ok','bk']){for(let i=1;i<=9;i++){let x=document.createElement('input');x.type='password';x.placeholder=(p==='ok'?'OPENCODE_KEY_':'BITDEER_KEY_')+i;x.id=p+i;$(p==='ok'?'oks':'bks').append(x)}}async function load(){let r=await fetch('/api/status'),s=await r.json();$('mode').value=s.provider_mode;$('status').innerHTML='OpenCode: <span class=ok>'+s.providers.opencode.keys+' keys</span> · Bitdeer: <span class=ok>'+s.providers.bitdeer.keys+' keys</span>';$('url').textContent=s.janitor_url;$('key').textContent=s.proxy_api_key;$('stats').textContent=JSON.stringify(s.stats,null,2)}async function save(){let b={provider_mode:$('mode').value};for(let i=1;i<=9;i++){if($('ok'+i).value)b['opencode_key_'+i]=$('ok'+i).value;if($('bk'+i).value)b['bitdeer_key_'+i]=$('bk'+i).value}await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});for(let i=1;i<=9;i++){$('ok'+i).value='';$('bk'+i).value=''}load()}load();setInterval(load,3000)</script>
